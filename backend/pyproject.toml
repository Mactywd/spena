[project]
name = "spena-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  # Il client dell'LLM dell'import (Claude Haiku via l'API Messages). Dipendenza di base
  # e fissata: da extra mancò dall'immagine (tests/test_image_dependencies.py).
  "anthropic==2.12.0",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "beautifulsoup4>=4.12",
  # Claude Code come libreria, per i Pasti: porta il suo binario, niente Node.
  # Fissata: il binario segue la versione.
  "claude-agent-sdk==0.2.180",
  "fastapi>=0.115",
  "httpx>=0.28",
  "itsdangerous>=2.2",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# pyyaml serve a tests/test_compose.py, che legge i file Compose per difendere la
# forma lunga di `env_file`: arriva comunque con uvicorn[standard], ma una
# dipendenza di test non dichiarata si rompe il giorno in cui si snelliscono le altre
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "httpx>=0.28", "httpx2>=2.0", "pyyaml>=6"]
embeddings = ["sentence-transformers>=3.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# la fixture `engine` è di sessione: senza questa riga gira su un altro event loop
asyncio_default_fixture_loop_scope = "session"
# stesso motivo: le funzioni di test devono girare sullo stesso loop di sessione
# dell'engine, altrimenti asyncpg si ritrova con un loop diverso da quello su cui
# è stata creata la connessione
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Una costante deprecata di Starlette diventa un errore, non un avviso: gli 8 avvisi per
# `HTTP_422_UNPROCESSABLE_ENTITY` li stampava ogni suite e non li leggeva nessuno.
# Il filtro `:app` guarda però il modulo che Starlette indica con il suo `stacklevel`, e
# ne prende solo alcuni usi (quelli a livello di modulo): la guardia vera è
# tests/test_no_deprecated_status.py, che legge anche le righe che nessun test attraversa.
# Il filtro si ferma ad `app`: senza `httpx2`, starlette.testclient avvisava da sé,
# all'import, che usava `httpx`; quell'avviso è della libreria e non va trasformato in
# errore. Dal 2026-11-21 `httpx2` è fra le `dev` e l'avviso non c'è più.
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning:app",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
