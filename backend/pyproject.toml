[project]
name = "spena-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pgvector>=0.3.6",
  "httpx>=0.28",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
# pyyaml serve a tests/test_compose.py, che legge i file Compose per difendere la
# forma lunga di `env_file`: arriva comunque con uvicorn[standard], ma una
# dipendenza di test non dichiarata si rompe il giorno in cui si snelliscono le altre
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "httpx>=0.28", "pyyaml>=6"]
ai = ["anthropic>=0.40"]
embeddings = ["sentence-transformers>=3.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# la fixture `engine` è di sessione: senza questa riga gira su un altro event loop
asyncio_default_fixture_loop_scope = "session"
# stesso motivo: le funzioni di test devono girare sullo stesso loop di sessione
# dell'engine, altrimenti asyncpg si ritrova con un loop diverso da quello su cui
# è stata creata la connessione
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
