services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spena}
      POSTGRES_DB: ${POSTGRES_DB:-spena}
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spena}"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    # `format: raw` non è decorativo: l'hash argon2 di APP_PASSWORD_HASH contiene
    # dei `$` e Compose, nella forma breve, li interpreta come riferimenti a
    # variabili. Misurato: 97 caratteri arrivano al container come 62, e l'accesso
    # fallisce sempre. Richiede Compose 2.30 o successivo.
    env_file:
      - path: .env
        format: raw
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spena}:${POSTGRES_PASSWORD:-spena}@db:5432/${POSTGRES_DB:-spena}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]

volumes:
  pgdata:
