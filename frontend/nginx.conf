server {
  listen 80;
  root /usr/share/nginx/html;

  # La fusione più grande sui dati veri ha rifatto 6.236 ricette in circa 130 s,
  # e il timeout di lettura di default di nginx (60 s) la trasformava in un 504.
  # Questa location, più specifica di /api/, vince su di essa per questa sola
  # rotta e le dà 300 s; ogni altra rotta resta sul default.
  location ~ ^/api/v1/ingredients/[^/]+/merge$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Il webhook di HC Webhook (H2). Nginx tiene di suo 1 MB, e un suo 413 non arriva mai
  # al backend: HC Webhook lo scriverebbe nel suo registro, e in «Attività» non si vedrebbe
  # niente. Qui fino a 4 MB, così oltre i 2 MB il rifiuto lo dà il backend, che lo registra
  # e lo mostra. `=` vince su ogni altra location per questo solo percorso.
  location = /api/v1/activity/hc-webhook {
    client_max_body_size 4m;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # La chat dei piatti (Pasti, piano 3): la risposta di Claude arriva un pezzo alla volta
  # (SSE). Senza `proxy_buffering off` Nginx la tratterrebbe fino alla fine; il backend
  # manda un ping ogni 15 s e risponde entro 240 s.
  location ~ ^/api/v1/meals/[^/]+/chat/messages$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # una single page application serve index.html per ogni percorso
  location / {
    try_files $uri $uri/ /index.html;
  }
}
