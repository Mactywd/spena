server {
  listen 80;
  root /usr/share/nginx/html;

  # La fusione più grande sui dati veri ha rifatto 6.236 ricette in circa 130 s,
  # e il timeout di lettura di default di nginx (60 s) la trasformava in un 504.
  # Questa location, più specifica di /api/, vince su di essa per questa sola
  # rotta e le dà 300 s; ogni altra rotta resta sul default.
  location ~ ^/api/v1/ingredients/[^/]+/merge$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # una single page application serve index.html per ogni percorso
  location / {
    try_files $uri $uri/ /index.html;
  }
}
