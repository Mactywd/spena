<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover non è decorativo: senza di esso le variabili
         env(safe-area-inset-*) valgono 0 su iOS, quindi --safe-bottom (src/index.css)
         non fa niente e la barra delle schede finisce sotto l'indicatore home. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- il fondo della pagina di ciascun tema (--color-page in src/index.css):
         colora la barra di stato, che così continua la pagina. Il chiaro è anche il
         theme_color del manifesto; lo scuro no, perché il manifesto ha un colore
         solo e non segue prefers-color-scheme -->
    <meta name="theme-color" content="#f1f4f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1210" media="(prefers-color-scheme: dark)" />
    <title>Spena</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
